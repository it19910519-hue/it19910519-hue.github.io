<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOMA Shop</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial;
            margin: 0;
            padding: 15px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
        }

        h2 {
            margin-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 80px;
        }

        .product-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .product-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-title {
            font-size: 14px;
            margin: 8px 0;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            cursor: pointer;
        }

        .q-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: var(--tg-theme-button-color, #0088cc);
            color: white;
        }

        #checkout-btn {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

<h2>🍕 AXIOMA MENU</h2>

<div class="products-grid" id="catalog"></div>

<button id="checkout-btn" class="btn">Оформить заказ</button>

<script src="script.js"></script>

</body>
</html>

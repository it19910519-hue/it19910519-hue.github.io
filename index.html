<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AXIOMA SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body { font-family: Arial; padding: 10px; }
.card { border:1px solid #ccc; padding:10px; margin:10px; }
button { padding:10px; width:100%; }
</style>
</head>

<body>
<h2>🍕 AXIOMA MENU</h2>

<div id="products"></div>

<button id="checkout" style="display:none">Оформить заказ</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const products = [
  {id:1, title:"Пицца Маргарита", price:200},
  {id:2, title:"Бургер", price:150}
];

let cart = {};

function render(){
  let html = "";

  products.forEach(p=>{
    html += `
      <div class="card">
        <b>${p.title}</b><br>
        ${p.price} грн<br>
        <button onclick="add(${p.id})">Добавить</button>
      </div>
    `;
  });

  document.getElementById("products").innerHTML = html;
}

function add(id){
  cart[id] = (cart[id] || 0) + 1;

  document.getElementById("checkout").style.display = "block";
}

document.getElementById("checkout").onclick = () => {
  let items = Object.keys(cart).map(id => {
    let p = products.find(x => x.id == id);
    return {...p, count: cart[id]};
  });

  tg.sendData(JSON.stringify({
    items,
    total: items.reduce((s,i)=>s+i.price*i.count,0)
  }));

  tg.close();
};

render();
</script>

</body>
</html>

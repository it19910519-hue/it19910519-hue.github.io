<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE_INTERFACE_v3.2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Палитра в стиле современного киберпанка */
            --bg-color: #030712;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(56, 189, 248, 0.15);
            --accent-primary: #38bdf8; /* Синий */
            --accent-secondary: #a855f7; /* Фиолетовый */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --status-ok: #4ade80;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.03);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        /* Стиль панелей "матовое стекло" */
        .panel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0.5;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-icon { color: var(--accent-primary); }

        /* Мониторинг процессов */
        .process-list { display: flex; flex-direction: column; gap: 10px; }
        
        .process-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .process-item:hover { border-color: rgba(56, 189, 248, 0.3); background: rgba(255,255,255,0.04); }

        .proc-info { display: flex; align-items: center; gap: 10px; }
        .proc-name { font-weight: 500; font-size: 14px; }
        .proc-meta { color: var(--text-muted); font-size: 12px; }

        .status-badge {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge.online { background: rgba(74, 222, 128, 0.1); color: var(--status-ok); }
        .status-badge.idle { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }

        /* Заметки */
        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            margin-bottom: 10px;
        }
        textarea:focus { outline: none; border-color: rgba(56, 189, 248, 0.4); }

        .btn-modern {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .btn-modern:hover { opacity: 0.9; }

        /* Метрики */
        .metric-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
        .metric-label { color: var(--text-muted); }
        .metric-value { font-weight: 500; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 65%; /* Пример прогресса до 70кг */
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <div class="logo">core_env / it19910519-hue</div>
        <div class="system-status" id="sysClock">00:00:00 // STATUS: OK</div>
    </header>

    <div class="grid-layout">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fa-solid fa-server panel-icon"></i>Активные сервисы</div>
                <div class="proc-meta">3 Модуля</div>
            </div>
            
            <div class="process-list">
                <div class="process-item">
                    <div class="proc-info">
                        <i class="fa-solid fa-robot" style="color:var(--accent-secondary);"></i>
                        <div>
                            <div class="proc-name">AXIOMA-09_bot</div>
                            <div class="proc-meta">Python v3.10 / core_instance</div>
                        </div>
                    </div>
                    <span class="status-badge online"><i class="fa-solid fa-circle" style="font-size:6px;"></i> Active</span>
                </div>

                <div class="process-item">
                    <div class="proc-info">
                        <i class="fa-solid fa-network-wired" style="color:var(--accent-primary);"></i>
                        <div>
                            <div class="proc-name">Local_Dev_Server</div>
                            <div class="proc-meta">localhost:8080</div>
                        </div>
                    </div>
                    <span class="status-badge online"><i class="fa-solid fa-circle" style="font-size:6px;"></i> Online</span>
                </div>

                <div class="process-item">
                    <div class="proc-info">
                        <i class="fa-solid fa-code-branch" style="color:var(--text-muted);"></i>
                        <div>
                            <div class="proc-name">Courier_App_Dev</div>
                            <div class="proc-meta">Phase: Prototyping</div>
                        </div>
                    </div>
                    <span class="status-badge idle">Standby</span>
                </div>
            </div>
        </div>

        <div class="right-stack" style="display:flex; flex-direction:column; gap:20px;">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-pen-nib panel-icon"></i>Dev_Notes</div>
                </div>
                <textarea id="notesArea" placeholder="Вставьте код или заметки... Данные сохраняются в браузере."></textarea>
                <div style="text-align: right;">
                    <button class="btn-modern" onclick="saveNotes()">Сохранить</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-target-arrow panel-icon"></i>Цели</div>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Текущий вес</span>
                    <span class="metric-value">65 kg</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Целевой вес</span>
                    <span class="metric-value">70 kg</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="proc-meta" style="text-align:center; margin-top:5px;">Прогресс: +5 kg до цели</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Часы и дата
    function updateClock() {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('ru-RU');
        document.getElementById('sysClock').innerText = `${timeStr} // STATUS: OK`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Загрузка и сохранение заметок в LocalStorage
    window.onload = function() {
        if(localStorage.getItem('core_v3_notes')) {
            document.getElementById('notesArea').value = localStorage.getItem('core_v3_notes');
        }
    }
    function saveNotes() {
        const text = document.getElementById('notesArea').value;
        localStorage.setItem('core_v3_notes', text);
        alert('Заметки сохранены!');
    }
</script>
</body>
</html>

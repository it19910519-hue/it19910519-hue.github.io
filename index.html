<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE_CORE_PANEL_v5.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg: #06070d; --panel: #0b0c16; --border: #1b1d36;
            --accent: #a855f7; --cyan: #06b6d4; --text: #e2e8f0;
            --muted: #475569; --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050508; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .lock-box {
            background: var(--panel); border: 1px solid var(--border);
            padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
        }

        .wrapper { max-width: 1200px; margin: 0 auto; display: none; }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
        .title { font-size: 16px; font-weight: 700; background: linear-gradient(90deg, var(--cyan), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .panel-title { font-size: 13px; text-transform: uppercase; font-weight: 700; color: var(--cyan); margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
        .data-label { color: #94a3b8; } .data-value { font-weight: 500; color: #fff; }

        input, select { background: #131524; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; width: 100%; font-size: 13px; }
        input:focus { outline: none; border-color: var(--cyan); }
        .btn { background: linear-gradient(90deg, var(--cyan), var(--accent)); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: all 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
        .pulse-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        
        .cmd-box { background: #131524; border: 1px solid #2d3154; border-radius: 6px; padding: 10px; font-size: 12px; color: var(--cyan); margin: 10px 0; word-break: break-all; display: none; text-align: center; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="panel-title" style="color: var(--accent); justify-content: center; margin-bottom: 20px;">
            <i class="fa-solid fa-shield-halved"></i> ACCESS_RESTRICTED
        </div>
        <input type="password" id="passwordInput" placeholder="Введите ключ доступа..." onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="btn" onclick="checkPassword()"><i class="fa-solid fa-key"></i> ДЕКОДИРОВАТЬ</button>
        <div id="loginError" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Ключ неверен. Доступ заблокирован.</div>
    </div>
</div>

<div class="wrapper" id="main-content">
    <header>
        <div class="title">// MISSION_CONTROL_LIVE //</div>
        <div style="font-size: 12px; color: #94a3b8;" id="clock">Синхронизация...</div>
    </header>

    <div class="grid">
        <div class="panel" style="border-color: var(--accent);">
            <div>
                <div class="panel-title" style="color: var(--accent);"><i class="fa-solid fa-user-ninja"></i> Target_Controller / Юзербот</div>
                <input type="text" id="targetInput" placeholder="Ник (например, @Love_12350)" oninput="generateCommand()">
                
                <div id="cmdDisplay" class="cmd-box"></div>
                
                <div class="data-row"><span class="data-label">Текущая цель:</span><span class="data-value" id="currentTarget">Не задана</span></div>
            </div>
            <button class="btn" id="actionBtn" onclick="copyAndOpen()" style="background: linear-gradient(90deg, var(--accent), #ec4899); color: white;">
                <i class="fa-solid fa-copy"></i> Сгенерировать команду
            </button>
        </div>

        <div class="panel">
            <div>
                <div class="panel-title"><i class="fa-solid fa-car"></i> Auto_Crawler / Поиск</div>
                <input type="text" id="carQuery" placeholder="Например: Subaru Legacy 2007">
                <select id="searchPlatform">
                    <option value="all">Искать по всем автосайтам Украины</option>
                    <option value="autoria">Только на Auto.ria</option>
                    <option value="olx">Только на OLX Авто</option>
                    <option value="rst">Только на RST</option>
                </select>
            </div>
            <button class="btn" onclick="executeAutoSearch()"><i class="fa-solid fa-magnifying-glass"></i> Запустить поиск</button>
        </div>

        <div class="panel">
            <div>
                <div class="panel-title"><i class="fa-solid fa-cloud-sun"></i> Weather_Meteo / Odesa</div>
                <div class="data-row"><span class="data-label">Температура:</span><span class="data-value" id="weather-temp">Загрузка...</span></div>
                <div class="data-row"><span class="data-label">Статус:</span><span class="data-value" id="weather-desc">Синхронизация</span></div>
            </div>
            <div style="font-size: 10px; color: var(--muted); margin-top: 15px;">Гео-координаты зафиксированы</div>
        </div>
    </div>
</div>

<script>
    const CORRECT_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const inputHash = CryptoJS.SHA256(input).toString();

        if (inputHash === CORRECT_HASH) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            fetchWeather();
            const savedTarget = localStorage.getItem('bot_target') || '@Love_12350';
            document.getElementById('currentTarget').innerText = savedTarget;
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('passwordInput').value = '';
        }
    }

    function generateCommand() {
        const input = document.getElementById('targetInput').value.trim();
        const cmdBox = document.getElementById('cmdDisplay');
        const btn = document.getElementById('actionBtn');
        
        if(input) {
            const cleanNick = input.replace('@', '');
            cmdBox.innerText = `set_${cleanNick}`;
            cmdBox.style.display = 'block';
            btn.innerHTML = '<i class="fa-solid fa-copy"></i> Скопировать команду';
        } else {
            cmdBox.style.display = 'none';
            btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i> Установить цель';
        }
    }

    function copyAndOpen() {
        const input = document.getElementById('targetInput').value.trim();
        if (!input) return alert('Введите ник цели!');
        
        const cleanNick = input.replace('@', '');
        const commandText = `set_${cleanNick}`;
        
        // Копируем текст в буфер обмена
        navigator.clipboard.writeText(commandText).then(() => {
            localStorage.setItem('bot_target', input);
            document.getElementById('currentTarget').innerText = input;
            alert(`Команда "${commandText}" скопирована! Отправь её в чат бота или Избранное.`);
            // Открываем Избранное в Telegram (me - это ссылка на твой личный чат Save Messages)
            window.open('https://t.me/me', '_blank');
        });
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ru-RU') + ' // SYS_OK'; }, 1000);

    function executeAutoSearch() {
        const query = document.getElementById('carQuery').value.trim();
        if (!query) return alert('Введите запрос!');
        const platform = document.getElementById('searchPlatform').value;
        let searchUrl = '';
        if (platform === 'autoria') searchUrl = `https://www.google.com/search?q=site:auto.ria.com++${encodeURIComponent(query)}`;
        else if (platform === 'olx') searchUrl = `https://www.google.com/search?q=site:olx.ua/d/uk/transport/legkovye-avtomobili/++${encodeURIComponent(query)}`;
        else if (platform === 'rst') searchUrl = `https://www.google.com/search?q=site:rst.ua++${encodeURIComponent(query)}`;
        else searchUrl = `https://www.google.com/search?q=(site:auto.ria.com+OR+site:rst.ua+OR+site:olx.ua)+prodam+${encodeURIComponent(query)}`;
        window.open(searchUrl, '_blank');
    }

    async function fetchWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.4825&longitude=30.7233&current_weather=true');
            const data = await res.json();
            if(data && data.current_weather) {
                document.getElementById('weather-temp').innerText = `${data.current_weather.temperature}°C`;
            }
        } catch (e) { document.getElementById('weather-temp').innerText = 'Ошибка API'; }
    }
</script>
</body>
</html>

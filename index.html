<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOMA Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-theme-bg-color: #fff; --tg-theme-text-color: #000; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 15px; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 80px; }
        .product-card { background-color: var(--tg-theme-secondary-bg-color, #f4f4f5); border-radius: 12px; padding: 10px; text-align: center; }
        .product-img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 14px; font-weight: bold; margin: 8px 0; }
        .btn { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; }
        .q-btn { width: 30px; height: 30px; background: var(--tg-theme-button-color); color: white; border: none; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>🍕 Меню AXIOMA</h2>
    <div class="products-grid" id="catalog"></div>
    <button id="checkout-btn" class="btn" style="display:none; position:fixed; bottom:10px; left:10px; right:10px;">Оформить</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const products = [
        { id: 1, title: "Пицца Маргарита", price: 180, img: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=300" },
        { id: 2, title: "Пицца Пепперони", price: 220, img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=300" }
    ];
    let cart = {};

    function render() {
        const cat = document.getElementById('catalog');
        cat.innerHTML = products.map(p => `
            <div class="product-card">
                <img class="product-img" src="${p.img}">
                <div class="product-title">${p.title}</div>
                <div id="controls-${p.id}">
                    <button class="btn" onclick="updateCart(${p.id}, 1)">В корзину</button>
                </div>
            </div>
        `).join('');
    }

    window.updateCart = (id, delta) => {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] <= 0) delete cart[id];
        
        // Обновляем кнопку/контролы
        const div = document.getElementById(`controls-${id}`);
        if (!cart[id]) {
            div.innerHTML = `<button class="btn" onclick="updateCart(${id}, 1)">В корзину</button>`;
        } else {
            div.innerHTML = `<button class="q-btn" onclick="updateCart(${id}, -1)">-</button> 
                             <span style="margin:0 10px">${cart[id]}</span> 
                             <button class="q-btn" onclick="updateCart(${id}, 1)">+</button>`;
        }
        
        // Обновляем кнопку заказа
        const total = Object.keys(cart).reduce((sum, id) => sum + (products.find(p=>p.id==id).price * cart[id]), 0);
        const btn = document.getElementById('checkout-btn');
        btn.style.display = total > 0 ? 'block' : 'none';
        btn.textContent = `Оформить на ${total} грн`;
    };

    document.getElementById('checkout-btn').onclick = () => {
        const order = Object.keys(cart).map(id => ({ ...products.find(p=>p.id==id), count: cart[id] }));
        tg.sendData(JSON.stringify({ items: order, total: order.reduce((s,i) => s + i.price*i.count, 0) }));
        setTimeout(() => tg.close(), 300);
    };

    render();
</script>
</body>
</html>
